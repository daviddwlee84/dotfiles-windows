name: windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: oven-sh/setup-bun@v2

      - name: Install chezmoi + PowerShell modules
        shell: pwsh
        run: |
          $ok = $false
          foreach ($try in 1..3) {
            winget install --id twpayne.chezmoi -e --silent --accept-source-agreements --accept-package-agreements
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "winget chezmoi attempt $try failed (exit $LASTEXITCODE); retrying..."
            Start-Sleep 8
          }
          echo "$env:LOCALAPPDATA\Microsoft\WinGet\Links" >> $env:GITHUB_PATH
          if (-not $ok) {
            Write-Host 'winget failed after retries; falling back to scoop'
            irm get.scoop.sh -OutFile "$env:TEMP\scoop.ps1"
            & "$env:TEMP\scoop.ps1" -RunAsAdmin
            scoop install chezmoi
            echo "$HOME\scoop\shims" >> $env:GITHUB_PATH
          }
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          Install-Module Pester -Force -Scope CurrentUser -SkipPublisherCheck
          $global:LASTEXITCODE = 0

      - name: Lint PowerShell (PSScriptAnalyzer)
        shell: pwsh
        run: |
          $issues = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $issues | Format-Table -AutoSize
          if ($issues | Where-Object Severity -eq 'Error') { throw "PSScriptAnalyzer found $(($issues | Where-Object Severity -eq 'Error').Count) error(s)" }

      # Runs BEFORE init on purpose: a prompt with no matching flag makes the
      # init step below die with an opaque `promptChoiceOnce: EOF`, and the
      # Pester step at the end never gets reached. This surfaces the actual
      # missing flag instead. (Invariant #1.)
      - name: "Init prompts are answerable non-interactively (invariant #1)"
        shell: pwsh
        run: Invoke-Pester -CI -Path ./tests/InitPrompts.Tests.ps1 -Output Detailed

      # This is a config/render contract, not a package-install E2E. It proves
      # `--promptDefaults` plus the three identity/role overrides stays a true
      # minimal profile, in state isolated from the feature-rich render below.
      - name: chezmoi minimal defaults contract (files only)
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'minimal-contract'
          $config = Join-Path $root 'config\chezmoi.toml'
          $state = Join-Path $root 'state.db'
          $dest = Join-Path $root 'home'
          New-Item -ItemType Directory -Force -Path (Split-Path $config), $dest | Out-Null

          # bootstrap.ps1 is dot-source safe; reuse its exact unattended argv so
          # prompt text and required defaults have one owner.
          . (Join-Path $PWD 'bootstrap.ps1')
          $minimalFlags = @(Get-UnattendedChezmoiArguments -Role minimal `
            -Name 'CI Minimal' -Email 'ci-minimal@example.com')
          chezmoi init --source $PWD --config $config --persistent-state $state `
            --destination $dest @minimalFlags
          if ($LASTEXITCODE -ne 0) { throw "minimal chezmoi init failed (exit $LASTEXITCODE)" }

          $dataJson = chezmoi data --source $PWD --config $config `
            --persistent-state $state --format json
          if ($LASTEXITCODE -ne 0) { throw "minimal chezmoi data failed (exit $LASTEXITCODE)" }
          $data = $dataJson | ConvertFrom-Json
          if ($data.role -ne 'minimal') { throw "expected role=minimal, got $($data.role)" }
          foreach ($property in @($data.PSObject.Properties | Where-Object Name -Like 'install*')) {
            if ($property.Value -ne $false) {
              throw "minimal default unexpectedly enables $($property.Name)=$($property.Value)"
            }
          }
          $expectations = [ordered]@{
            agentSounds = 'none'
            backupMode = 'smart'
            enableVimMode = $true
            useChineseMirror = $false
            managedMachine = $false
            allowPublicPackageFallback = $false
          }
          foreach ($name in $expectations.Keys) {
            $actual = $data.$name
            if ($actual -ne $expectations[$name]) {
              throw "minimal default mismatch: $name=$actual"
            }
          }

          chezmoi apply --source $PWD --config $config --persistent-state $state `
            --destination $dest --exclude scripts,externals --no-tty --verbose
          if ($LASTEXITCODE -ne 0) { throw "minimal files-only apply failed (exit $LASTEXITCODE)" }

      - name: chezmoi init (writes config from prompt answers)
        shell: pwsh
        run: |
          $flags = @(
            '--promptChoice','Role: workstation (full desktop) or minimal (shell only)=minimal',
            '--promptString','Your full name (git)=CI Runner',
            '--promptString','Your git email=ci@example.com',
            # true (unlike most install toggles) so the render+parse step below
            # covers the agent blocks that are gated behind it: the npm/peon-ping
            # install in run_onchange_after_10_packages and the whole of
            # run_onchange_after_25_claude_settings. `chezmoi apply --exclude
            # scripts` means nothing is ever actually installed in CI.
            '--promptBool','Install coding agents (Claude Code, OpenCode, Codex, Copilot CLI, Pi, pia, OMP, SpecStory)=true',
            # `both` (not the workstation default `notify`) so the render+parse
            # covers BOTH hook-building branches of run_onchange_after_25.
            '--promptChoice','Agent completion feedback (none|notify|peon|both)=both',
            # true (unlike the other install toggles) so the render+parse step
            # below exercises the SpecStory release block; `chezmoi apply --exclude
            # scripts` means it never actually installs in CI.
            '--promptBool','Install standalone SpecStory CLI (also included with coding agents)=true',
            '--promptBool','Install GUI apps via winget (VSCode, Cursor, Notepad++, Terminal, Alacritty, PowerToys, Raycast)=false',
            '--promptBool','Install WSL2 (Docker Desktop backend; needs admin + reboot)=false',
            '--promptBool','Install a WSL2 Ubuntu distro and bootstrap cross-platform dotfiles inside it (needs admin; requires WSL2 platform)=false',
            '--promptString','WSL Ubuntu username=ci',
            '--promptChoice','WSL Ubuntu dotfiles bootstrap (headless|interactive|none)=none',
            '--promptBool','Install utility apps via winget (CPU-Z, GPU-Z, TreeSize, VLC, Everything, ShareX, HWiNFO)=false',
            '--promptBool','Install gaming apps (Steam)=false',
            '--promptBool','Install extra runtimes (rust, go, ruby) beyond node/bun/uv=false',
            '--promptBool','Install media CLIs (ffmpeg, imagemagick)=false',
            '--promptBool','Install local LLM tools (Ollama, LiteLLM)=false',
            # true so the render+parse step exercises the summarize package block;
            # `chezmoi apply --exclude scripts` means npm/scoop never actually run.
            '--promptBool','Install summarize (YouTube/web/PDF summarizer CLI)=true',
            '--promptBool','Install tunnel tools (ngrok, cloudflared)=false',
            '--promptBool','Install Infrastructure-as-Code tools (Azure CLI, Terraform, OpenTofu)=false',
            '--promptBool','Install and enable the OpenSSH server / sshd (needs admin, opens inbound port 22)=false',
            '--promptBool','Install herdr (native Windows terminal multiplexer, preview beta)=false',
            '--promptBool','Install Clink + starship/zoxide/fzf for cmd.exe (DOS prompt)=false',
            '--promptBool','Install try (Ruby ephemeral-workspace CLI, needs Ruby)=false',
            # true (unlike the other install toggles) so the render+parse step
            # exercises the go-install block and the apply step deploys the
            # translate tv channel; `chezmoi apply --exclude scripts` means the
            # multi-minute `go install` never actually runs in CI.
            '--promptBool','Install translate (terminal translator CLI and TUI)=true',
            # true so the render+parse step exercises the Install-Weasel block and
            # the rime redeploy script, and the apply step deploys the
            # AppData/Roaming/Rime YAML; --exclude scripts means winget never runs.
            '--promptBool','Install the Rime input method (Weasel) for Traditional Chinese (needs admin)=true',
            '--promptBool','Use China (GFW) mirrors for pip/uv, npm, RubyGems, Go, and rustup=false',
            '--promptBool','Managed or corporate machine (skip org-policy-blocked apps like Tailscale and Grammarly)=false',
            '--promptBool','Allow one public PyPI/npm retry after eligible corporate feed failures=false',
            '--promptChoice','Back up existing files before apply (smart|full|off)=off',
            '--promptBool','Enable PSReadLine vi editing mode=true'
          )
          chezmoi init --source $PWD --no-tty @flags

      - name: Parse-check rendered .ps1.tmpl scripts
        shell: pwsh
        run: |
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          [Console]::InputEncoding = $utf8
          [Console]::OutputEncoding = $utf8
          $OutputEncoding = $utf8
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1.tmpl | ForEach-Object {
            $renderedLines = @(Get-Content -Raw $_.FullName | chezmoi execute-template --source .)
            if ($LASTEXITCODE -ne 0 -or -not $renderedLines) { Write-Host "RENDER FAIL: $($_.Name)"; $failed = $true; return }
            $rendered = $renderedLines -join "`n"
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseInput($rendered, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { Write-Host "PARSE FAIL: $($_.Name)"; $errors | ForEach-Object { Write-Host "  $_" }; $failed = $true }
            else { Write-Host "OK:   $($_.Name)" }
          }
          if ($failed) { throw 'A rendered template failed to render or parse' }

      - name: chezmoi apply (files only, no package scripts)
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'dothome'
          $codexDir = Join-Path $dest '.codex'
          $codexPath = Join-Path $codexDir 'config.toml'
          New-Item -ItemType Directory -Force -Path $codexDir | Out-Null
          $seed = @'
          model = "ci-preserved-model"

          [model_providers.ci]
          base_url = "https://ci.example.invalid/v1"
          wire_api = "responses"

          [tui]
          status_line = ["old-status"]
          '@
          [System.IO.File]::WriteAllText($codexPath, $seed + "`r`n", [System.Text.UTF8Encoding]::new($false))

          # pi-agents is a private cross-repo external. This repository has no
          # read token for it, so CI validates the rendered external contract in
          # Pester and lets pi-agents' own Windows workflow exercise launchers.
          chezmoi apply --source $PWD --destination $dest --exclude scripts,externals --verbose

          $piWrapperBin = Join-Path $dest '.config\powershell\bin'
          foreach ($launcher in 'pia-pi.ps1', 'pi.cmd') {
            if (-not (Test-Path -LiteralPath (Join-Path $piWrapperBin $launcher) -PathType Leaf)) {
              throw "managed Pi wrapper is missing $launcher"
            }
          }

          $codexConfig = Get-Content -Raw -LiteralPath $codexPath
          if ($codexConfig -notmatch 'model = "ci-preserved-model"') {
            throw 'Codex modifier dropped an unrelated top-level setting'
          }
          if ($codexConfig -notmatch 'base_url = "https://ci\.example\.invalid/v1"' -or
              $codexConfig -notmatch 'wire_api = "responses"') {
            throw 'Codex modifier dropped an unrelated provider setting'
          }
          if ($codexConfig -match 'old-status') {
            throw 'Codex modifier retained the stale managed status_line'
          }
          foreach ($item in 'model-with-reasoning', 'fast-mode', 'git-branch', 'context-remaining', 'task-progress', 'current-dir') {
            if ($codexConfig -notmatch [regex]::Escape('"' + $item + '"')) {
              throw "Codex modifier did not install managed status item: $item"
            }
          }

          Write-Host '--- deployed tree ---'
          Get-ChildItem -Recurse -File $dest | ForEach-Object { $_.FullName.Replace($dest,'') }

      - name: Pester tests
        shell: pwsh
        run: |
          if (Get-ChildItem -Recurse -Filter *.Tests.ps1) {
            Invoke-Pester -CI -Path . -Output Detailed
          } else { Write-Host 'no Pester tests yet' }
