# lazygit — use delta as the diff pager (needs `delta`, installed via scoop).
#
# Lazygit v0.64 renamed custom pagers to diff renderers. Use the current
# `git.diffRenderers` array so lazygit does not migrate and rewrite this plain
# chezmoi-managed file every time it starts.
#
# Location: lazygit reads %APPDATA%\lazygit\config.yml by default, but honours
# $XDG_CONFIG_HOME — which our pwsh profile sets to ~/.config — so this lands at
# ~/.config/lazygit/config.yml, matching the macOS/Linux layout.
git:
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never --syntax-theme base16-256 -s
