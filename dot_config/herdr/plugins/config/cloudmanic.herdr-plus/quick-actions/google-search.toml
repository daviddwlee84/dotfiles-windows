# herdr-plus Quick Action — the plugin's "Search Google" form starter example.
# Managed by chezmoi. Choosing it shows a text field; what you type becomes
# {{.Value}} (urlquery-escaped by herdr-plus before substitution).
# `x open` -> Start-Process (see github.toml).
name = "Search Google"
description = "Type a query and open the results"
type = "form"
command = '''pwsh -NoProfile -Command "Start-Process 'https://www.google.com/search?q={{.Value | urlquery}}'"'''

[form]
prompt = "Search Google for"
placeholder = "e.g. herdr terminal multiplexer"
