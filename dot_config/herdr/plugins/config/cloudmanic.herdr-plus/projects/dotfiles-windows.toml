# herdr-plus Project template — the Windows analog of the unix repo's "chezmoi"
# project (shell + lazygit + nvim). Launch from the Projects fuzzy picker
# (prefix+O) after installing the plugin:
#
#   herdr plugin install cloudmanic/herdr-plus
#
# Add your own per-repo projects alongside this file. A tab uses EITHER
# `command` OR a [[tabs.panes]] block (max 4 panes/tab). `working_dir` is
# expanded by herdr-plus itself (~ and $ENV), not by a shell.
# Schema: https://github.com/cloudmanic/herdr-plus
name = "dotfiles-windows"
description = "Windows dotfiles repo — editor, git, shell"
working_dir = "~/.local/share/chezmoi"

[[tabs]]
name = "editor"
command = "nvim"

[[tabs]]
name = "git"
command = "lazygit"

[[tabs]]
name = "shell"
# no command -> empty interactive shell (pwsh, per [terminal] default_shell)
