# ~/.config/yazi/yazi.toml (Windows). Resolved via $YAZI_CONFIG_HOME, set in
# profile.d/00_env.ps1. Adapted from the macOS/Linux dotfiles: the layout/sort
# settings port verbatim; openers use Windows-native commands.
#
# yazi 25/26 uses the [mgr] table (older versions used [manager]).

[mgr]
ratio = [1, 4, 3]          # 1/8 parent, 4/8 current, 3/8 preview
sort_by = "natural"
sort_dir_first = true
linemode = "size"
show_hidden = true
show_symlink = true

[open]
rules = [
  # open / reveal are built in; text editing follows editorcfg.
  { url = "*/", use = ["nvim_dir", "git", "reveal", "open"] },
  { mime = "text/*", use = ["edit", "open"] },
  { mime = "*", use = ["open"] },
]

[opener]
edit = [
  { run = 'if defined EDITOR ("%EDITOR%" %*) else (dotfiles-editor %*)', block = true, desc = "Preferred editor" },
]
nvim_dir = [
  { run = 'nvim %*', block = true, desc = "Neovim (directory)" },
]
# Open lazygit in the hovered directory. %* is the selected path on Windows;
# adjust the placeholder if your yazi version differs.
git = [
  { run = 'cmd /c cd /d "%*" && lazygit', block = true, desc = "Lazygit (here)" },
]

# Git state signs for both files and directories. `id` keeps the rule parseable
# on Yazi 26.1.x; `group` is required by 26.8.15+. The managed guard delegates
# to git.yazi when compatible and becomes a noop during the upgrade gap.
[[plugin.prepend_fetchers]]
id = "git"
url = "*"
run = "git-guard"
group = "git"

[[plugin.prepend_fetchers]]
id = "git"
url = "*/"
run = "git-guard"
group = "git"
